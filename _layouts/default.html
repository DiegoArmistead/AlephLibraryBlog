<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/png" href="{{ '/aleph_icon_1024.png' | relative_url }}">
  <style>
    :root{
      --paper:#F4F0E7; --surface:#FBF8F2;
      --ink:#201D18; --ink-soft:#5C5445; --ink-faint:#8B8171;
      --rubric:#9E2B25; --gold:#A9803A; --hair:#E1DACB; --hair-strong:#D0C7B2;
      --maxw:960px;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --paper:#15120F; --surface:#1D1915;
        --ink:#EEE6D7; --ink-soft:#B1A895; --ink-faint:#867C6A;
        --rubric:#DA6058; --gold:#CBA35C; --hair:#312A22; --hair-strong:#3F372D;
      }
    }
    :root[data-theme="dark"]{
      --paper:#15120F;--surface:#1D1915;--ink:#EEE6D7;--ink-soft:#B1A895;--ink-faint:#867C6A;
      --rubric:#DA6058;--gold:#CBA35C;--hair:#312A22;--hair-strong:#3F372D;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto};*{animation:none!important;transition:none!important}}
    body{
      background:var(--paper);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,ui-sans-serif,system-ui,sans-serif;
      font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;
    }
    .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}

    .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.24em;
      text-transform:uppercase;color:var(--rubric);font-weight:600;}

    header.top{border-bottom:1px solid var(--hair);}
    header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;}
    .mark{display:flex;align-items:center;gap:9px;font-family:"Iowan Old Style",Palatino,Georgia,serif;
      font-size:21px;font-weight:600;letter-spacing:.01em;color:var(--ink);text-decoration:none;}
    .mark img {height: 24px; width: auto;}
    .top .status{font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--ink-faint);border:1px solid var(--hair-strong);border-radius:999px;padding:5px 12px;}

    .hero{text-align:center;padding:clamp(70px,13vw,140px) 0 clamp(56px,9vw,104px);}
    .hero .eyebrow{margin-bottom:26px;}
    h1{font-family:"Iowan Old Style",Palatino,Georgia,ui-serif,serif;font-weight:700;
      font-size:clamp(38px,6.6vw,74px);line-height:1.03;letter-spacing:-.015em;
      max-width:16ch;margin:0 auto;text-wrap:balance;}
    h1 em{font-style:italic;color:var(--rubric);}
    .hero p.sub{max-width:52ch;margin:30px auto 0;color:var(--ink-soft);font-size:clamp(18px,2.2vw,21px);
      line-height:1.55;text-wrap:pretty;}
    .hero p.sub b{color:var(--ink);font-weight:600;}

    section{padding:clamp(56px,9vw,104px) 0;}
    .rule{border:none;border-top:1px solid var(--hair);}

    .statement{text-align:center;}
    .statement .lead{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:clamp(24px,3.4vw,34px);
      line-height:1.32;max-width:24ch;margin:0 auto;letter-spacing:-.01em;text-wrap:balance;color:var(--ink);}
    .statement .lead .dim{color:var(--ink-faint);}
    .statement .foot{margin:22px auto 0;max-width:46ch;color:var(--ink-soft);font-size:17px;}

    .ideas-head{text-align:center;margin-bottom:clamp(40px,6vw,64px);}
    .ideas-head h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:clamp(26px,3.6vw,38px);
      font-weight:700;letter-spacing:-.01em;text-wrap:balance;}
    .ideas{display:grid;grid-template-columns:1fr;gap:2px;background:var(--hair);border:1px solid var(--hair);
      border-radius:16px;overflow:hidden;}
    @media(min-width:720px){.ideas{grid-template-columns:1fr 1fr;}}
    .idea{background:var(--surface);padding:clamp(26px,4vw,38px);}
    .idea .n{font-family:ui-monospace,monospace;font-size:12px;color:var(--rubric);letter-spacing:.1em;font-weight:600;}
    .idea h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:23px;font-weight:700;margin:12px 0 9px;
      letter-spacing:-.01em;}
    .idea p{color:var(--ink-soft);font-size:16.5px;line-height:1.55;max-width:38ch;}

    .graph{text-align:center;}
    .graph svg{width:min(460px,86vw);height:auto;display:block;margin:0 auto 30px;}
    .graph .node{fill:var(--rubric);}
    .graph .node.dim{fill:var(--gold);}
    .graph .edge{stroke:var(--hair-strong);stroke-width:1.4;fill:none;}
    .graph .lead{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:clamp(22px,3vw,30px);
      line-height:1.3;max-width:22ch;margin:0 auto;letter-spacing:-.01em;text-wrap:balance;}
    .graph .foot{margin:18px auto 0;max-width:48ch;color:var(--ink-soft);font-size:16.5px;}
    .pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

    .philo{text-align:center;}
    .philo .big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:clamp(26px,4vw,42px);
      font-weight:700;line-height:1.18;max-width:18ch;margin:0 auto;letter-spacing:-.015em;text-wrap:balance;}
    .philo .row{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;margin-top:34px;}
    .philo .chip{font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft);
      display:inline-flex;align-items:center;gap:8px;}
    .philo .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rubric);}

    footer{border-top:1px solid var(--hair);padding:clamp(48px,7vw,78px) 0 60px;text-align:center;}
    footer img.wordmark {height: 48px; width: auto; margin: 0 auto 14px; display: block; filter: brightness(0) invert(1); opacity: 0.9;}
    @media (prefers-color-scheme:light){
      footer img.wordmark {filter: brightness(0); opacity: 0.8;}
    }
    :root[data-theme="light"] footer img.wordmark {filter: brightness(0); opacity: 0.8;}
    footer .tag{margin:14px auto 0;max-width:40ch;color:var(--ink-soft);font-size:16px;}
    footer .meta{margin-top:26px;color:var(--ink-faint);font-size:13.5px;font-family:ui-monospace,monospace;
      letter-spacing:.04em;}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="mark" href="{{ '/' | relative_url }}">
        <img src="{{ '/aleph_logo_tinta_transparente.png' | relative_url }}" alt="Aleph Icon">
        <span>Aleph</span>
      </a>
      <span class="status">iOS · Coming Soon</span>
    </div>
  </header>

  {{ content }}

  <footer>
    <div class="wrap">
      <img src="{{ '/aleph_wordmark-2.png' | relative_url }}" alt="Aleph Wordmark" class="wordmark">
      <p class="tag">Engineered by one person, with severe rigor. For those who read to build mental models, not to show off a counter.</p>
      <p class="meta">Coming Soon to iOS · &copy; {{ site.time | date: '%Y' }}</p>
    </div>
  </footer>
</body>
</html>
